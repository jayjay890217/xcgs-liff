<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>XCGS 會員綁定</title>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg: #111;
      --card: #1d1d1d;
      --field: #2b2b2b;
      --line: #444;
      --text: #fff;
      --muted: #aaa;
      --brand: #ff6a00;
      --brand-soft: #ffb066;
      --ok: #3ecf6e;
      --err: #ff5c5c;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }

    .box {
      max-width: 520px;
      margin: auto;
      background: var(--card);
      padding: 24px 20px;
      border-radius: 16px;
      border-top: 5px solid var(--brand);
    }

    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); margin-bottom: 20px; }

    .hello {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #262626;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .hello img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .hello .tag {
      margin-left: auto;
      font-size: 12px;
      color: var(--brand-soft);
      border: 1px solid var(--brand-soft);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .notice {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
      background: #3a2a14;
      color: #ffd9b3;
    }
    .notice a { color: var(--brand-soft); }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 15px;
    }
    label .req { color: var(--brand); margin-left: 2px; }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      font-size: 16px; /* 16px 以上 iPhone 才不會自動放大 */
      -webkit-appearance: none;
      appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(135deg, #aaa 50%, transparent 50%);
      background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); }
    input.invalid { border-color: var(--err); }

    .hint { font-size: 13px; color: var(--err); margin-top: 4px; min-height: 0; }

    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .consent input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; -webkit-appearance: checkbox; appearance: auto; accent-color: var(--brand); }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { background: #333; }

    #status { margin-top: 14px; font-size: 14px; color: var(--brand-soft); min-height: 1em; }
    #status.err { color: var(--err); }

    .center { text-align: center; padding: 28px 0 8px; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid #333;
      border-top-color: var(--brand);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .big-icon { font-size: 48px; margin-bottom: 8px; }
    .summary {
      text-align: left;
      background: #262626;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.8;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>

<div class="box">

  <h1>旭馳車業｜XCGS</h1>
  <div class="sub">會員資料綁定</div>

  <!-- 載入中 -->
  <section id="view-loading" class="center">
    <div class="spinner"></div>
    <div id="loading-text">載入中…</div>
  </section>

  <!-- 錯誤 -->
  <section id="view-error" class="center" hidden>
    <div class="big-icon">⚠️</div>
    <div id="error-text">發生錯誤</div>
    <button class="secondary" onclick="location.reload()">重新整理</button>
  </section>

  <!-- 表單 -->
  <section id="view-form" hidden>
    <div class="hello">
      <img id="avatar" alt="" hidden>
      <span id="hello-text"></span>
      <span id="bound-tag" class="tag" hidden>已綁定・可修改</span>
    </div>

    <div id="friend-notice" class="notice" hidden>
      您尚未加入旭馳車業官方帳號好友，將無法收到車輛通知。
      <a id="friend-link" href="#" hidden>點此加入好友</a>
    </div>

    <form id="form" novalidate>
      <label for="name">姓名<span class="req">*</span></label>
      <input id="name" autocomplete="name" placeholder="請輸入姓名" maxlength="30">
      <div class="hint" id="hint-name"></div>

      <label for="phone">手機號碼<span class="req">*</span></label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="例如：0912345678" maxlength="13">
      <div class="hint" id="hint-phone"></div>

      <label for="plate">車牌<span class="req">*</span></label>
      <input id="plate" autocapitalize="characters" autocomplete="off" placeholder="例如：ABC-1234" maxlength="9">
      <div class="hint" id="hint-plate"></div>

      <label for="model">車種</label>
      <input id="model" placeholder="例如：DRG 2.0" maxlength="40">

      <label for="relationship">您是這台車的？</label>
      <select id="relationship">
        <option value="車主本人">車主本人</option>
        <option value="家人">家人</option>
        <option value="朋友">朋友</option>
        <option value="其他">其他</option>
      </select>

      <label class="consent">
        <input type="checkbox" id="consent">
        <span>我同意旭馳車業蒐集上述資料及 LINE 帳號識別碼，僅用於車輛保養、維修進度與會員服務通知。</span>
      </label>

      <button type="submit" id="submit">確認綁定</button>
      <div id="status"></div>
    </form>
  </section>

  <!-- 完成 -->
  <section id="view-done" class="center" hidden>
    <div class="big-icon">✅</div>
    <div id="done-title" style="font-size:18px;font-weight:bold;">綁定成功</div>
    <div class="summary" id="done-summary"></div>
    <button id="close-btn">關閉</button>
    <button class="secondary" id="edit-btn">修改資料</button>
  </section>

</div>

<script>
// ============================================================
// 設定
// ============================================================
const CONFIG = {
  LIFF_ID: "2011218129-CeYpPJHj",
  // Apps Script 部署後的「網頁應用程式」網址（…/exec）
  API_URL: "PASTE_YOUR_APPS_SCRIPT_URL_HERE",
  // 官方帳號 ID（含 @，例如 @123abcde）；留空就不顯示加好友按鈕
  OA_ID: ""
};

// ============================================================
// 小工具
// ============================================================
const $ = (id) => document.getElementById(id);
let idToken = null;
let submitting = false;

function show(view) {
  ["loading", "error", "form", "done"].forEach(v => {
    $("view-" + v).hidden = (v !== view);
  });
}

function fail(msg) {
  $("error-text").textContent = msg;
  show("error");
}

function setStatus(msg, isErr) {
  $("status").textContent = msg || "";
  $("status").className = isErr ? "err" : "";
}

// 呼叫 Apps Script。用 text/plain 避免 CORS 預檢（Apps Script 不支援 OPTIONS）
async function api(action, payload) {
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, idToken }, payload || {}))
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (!data.ok) {
    const err = new Error(data.error || "伺服器錯誤");
    err.code = data.code;
    throw err;
  }
  return data;
}

// ------------------------------------------------------------
// 手機：去掉空白/符號，+886 9xx → 09xx
// ------------------------------------------------------------
function normalizePhone(v) {
  let d = String(v || "").replace(/\D/g, "");
  if (d.startsWith("8869")) d = "0" + d.slice(3);
  return d;
}

// ------------------------------------------------------------
// 車牌：在「英文 ↔ 數字」交界處補上 -
// ABC1234→ABC-1234、AB1234→AB-1234、1234AB→1234-AB、123ABC→123-ABC
// 交界不只一處（例如 5A1234）就保留使用者自己打的 -
// ------------------------------------------------------------
function normalizePlate(v) {
  const raw = String(v || "").toUpperCase().replace(/[\s_．.]/g, "").replace(/[－—–]/g, "-");
  const clean = raw.replace(/[^A-Z0-9]/g, "");
  if (!clean) return "";

  const groups = clean.match(/[A-Z]+|[0-9]+/g) || [];
  if (groups.length === 2) return groups[0] + "-" + groups[1];

  const kept = raw.replace(/[^A-Z0-9-]/g, "").replace(/-+/g, "-").replace(/^-|-$/g, "");
  return kept || clean;
}

// ============================================================
// 驗證
// ============================================================
function validate() {
  const name = $("name").value.trim();
  const phone = normalizePhone($("phone").value);
  const plate = normalizePlate($("plate").value);

  const errs = {
    name: name ? "" : "請填寫姓名",
    phone: /^09\d{8}$/.test(phone) ? "" : "請輸入 09 開頭的 10 碼手機號碼",
    plate: /^[A-Z0-9]{2,4}-[A-Z0-9]{2,4}$/.test(plate) ? "" : "車牌格式不正確，例如 ABC-1234"
  };

  let firstBad = null;
  for (const k of Object.keys(errs)) {
    $("hint-" + k).textContent = errs[k];
    $(k).classList.toggle("invalid", !!errs[k]);
    if (errs[k] && !firstBad) firstBad = k;
  }
  if (firstBad) {
    $(firstBad).focus();
    return null;
  }

  return {
    name,
    phone,
    plate,
    model: $("model").value.trim(),
    relationship: $("relationship").value
  };
}

// ============================================================
// 表單填入 / 完成畫面
// ============================================================
function fillForm(m) {
  $("name").value = m.name || "";
  $("phone").value = m.phone || "";
  $("plate").value = m.plate || "";
  $("model").value = m.model || "";
  if (m.relationship) $("relationship").value = m.relationship;
}

function showDone(m, isUpdate) {
  $("done-title").textContent = isUpdate ? "資料已更新" : "綁定成功";
  const rows = [
    ["姓名", m.name], ["手機", m.phone], ["車牌", m.plate],
    ["車種", m.model || "—"], ["身分", m.relationship]
  ];
  const box = $("done-summary");
  box.textContent = "";
  rows.forEach(([k, v]) => {
    const line = document.createElement("div");
    line.textContent = k + "：" + v;
    box.appendChild(line);
  });
  $("close-btn").hidden = !liff.isInClient();
  show("done");
}

// ============================================================
// 主流程
// ============================================================
async function main() {
  if (CONFIG.API_URL.startsWith("PASTE_")) {
    return fail("系統尚未設定完成（缺少 API_URL）。");
  }

  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
  } catch (e) {
    console.error(e);
    return fail("LINE 初始化失敗，請從官方帳號選單重新開啟。");
  }

  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.href });
    return;
  }

  idToken = liff.getIDToken();
  if (!idToken) {
    return fail("無法取得 LINE 身分，請確認 LIFF 已開啟 openid 權限。");
  }

  // 顯示 LINE 名稱與頭像（僅畫面用，真正的 userId 由後端從 ID Token 取得）
  const decoded = liff.getDecodedIDToken() || {};
  $("hello-text").textContent = "LINE 已登入：" + (decoded.name || "");
  if (decoded.picture) {
    $("avatar").src = decoded.picture;
    $("avatar").hidden = false;
  }

  // 好友檢查（沒加好友就收不到推播）
  try {
    const f = await liff.getFriendship();
    if (!f.friendFlag) {
      $("friend-notice").hidden = false;
      if (CONFIG.OA_ID) {
        $("friend-link").href = "https://line.me/R/ti/p/" + encodeURIComponent(CONFIG.OA_ID);
        $("friend-link").hidden = false;
      }
    }
  } catch (e) {
    // 沒開 Add friend option 或非 LINE 內開啟時會失敗，略過
  }

  // 查詢是否已綁定過 → 預填
  $("loading-text").textContent = "讀取會員資料…";
  try {
    const r = await api("get");
    if (r.member) {
      fillForm(r.member);
      $("bound-tag").hidden = false;
      $("submit").textContent = "更新資料";
      $("consent").checked = true;
    }
  } catch (e) {
    console.error(e);
    if (e.code === "TOKEN_EXPIRED") {
      liff.logout();
      liff.login({ redirectUri: location.href });
      return;
    }
    // 查詢失敗不擋填寫
  }

  show("form");
}

// ============================================================
// 事件
// ============================================================
$("plate").addEventListener("blur", () => {
  $("plate").value = normalizePlate($("plate").value);
});
$("phone").addEventListener("blur", () => {
  const p = normalizePhone($("phone").value);
  if (p) $("phone").value = p;
});

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (submitting) return;

  const data = validate();
  if (!data) return;

  if (!$("consent").checked) {
    setStatus("請勾選同意個資使用說明", true);
    return;
  }

  submitting = true;
  $("submit").disabled = true;
  setStatus("送出中…");

  try {
    const r = await api("bind", data);
    setStatus("");
    showDone(r.member || data, r.updated);
  } catch (e) {
    console.error(e);
    if (e.code === "TOKEN_EXPIRED") {
      setStatus("登入已過期，正在重新登入…", true);
      liff.logout();
      liff.login({ redirectUri: location.href });
      return;
    }
    setStatus("❌ " + (e.message && !/fetch|HTTP/i.test(e.message) ? e.message : "綁定失敗，請稍後再試"), true);
  } finally {
    submitting = false;
    $("submit").disabled = false;
  }
});

$("close-btn").addEventListener("click", () => liff.closeWindow());
$("edit-btn").addEventListener("click", () => {
  $("bound-tag").hidden = false;
  $("submit").textContent = "更新資料";
  show("form");
});

main();
</script>

</body>
</html>
