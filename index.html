<script>

let lineProfile = null;

const WEBHOOK_URL =
  "https://jay890217.app.n8n.cloud/webhook/932e0d03-1b34-42fc-91e3-361579504380";

// LINE LIFF 初始化
async function main() {
  try {
    await liff.init({
      liffId: "2011218129-CeYpPJHj"
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    lineProfile = await liff.getProfile();

    document.getElementById("status").innerText =
      "LINE 已登入：" + lineProfile.displayName;

  } catch (error) {
    console.error(error);

    document.getElementById("status").innerText =
      "LINE 初始化失敗";
  }
}


// 車牌格式化
function formatPlate() {
  const input = document.getElementById("plate");

  let value = input.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  if (!value) return;

  // 4碼 → XX-XX
  if (value.length === 4) {
    value =
      value.slice(0, 2) +
      "-" +
      value.slice(2);
  }

  // 6碼、7碼 → XXX-XXX / XXX-XXXX
  else if (
    value.length === 6 ||
    value.length === 7
  ) {
    value =
      value.slice(0, 3) +
      "-" +
      value.slice(3);
  }

  input.value = value;
}


// 送出表單
async function submitForm() {

  formatPlate();

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const plate =
    document.getElementById("plate").value.trim();

  const model =
    document.getElementById("model").value.trim();

  const relationship =
    document.getElementById("relationship").value;


  if (!name || !phone || !plate) {
    alert("請填寫姓名、手機與車牌");
    return;
  }

  if (!lineProfile) {
    alert("LINE 尚未完成登入，請稍後再試");
    return;
  }

  const data = {
    name: name,
    phone: phone,
    plate: plate,
    model: model,
    relationship: relationship,
    lineUserId: lineProfile.userId,
    lineDisplayName: lineProfile.displayName
  };

  try {

    document.getElementById("status").innerText =
      "資料確認中...";

    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error(
        "送出失敗：" + response.status
      );
    }

    document.getElementById("status").innerText =
      "✅ 資料已送出";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ 送出失敗：" + error.message;
  }
}

main();

</script>
