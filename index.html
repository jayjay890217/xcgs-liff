<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCGS 會員綁定</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 520px;
      margin: auto;
      background: #1d1d1d;
      padding: 24px;
      border-radius: 16px;
      border-top: 5px solid #ff6a00;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #ff6a00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 16px;
      color: #ffb066;
    }

    select {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #2b2b2b;
  color: white;
  font-size: 16px;
}
  </style>
</head>

<body>

<div class="box">

  <h1>旭馳車業｜XCGS</h1>
  <div class="sub">會員資料綁定</div>

  <label>姓名</label>
  <input id="name" placeholder="請輸入姓名">

  <label>手機號碼</label>
  <input id="phone" placeholder="例如：0912345678">

  <label>車牌</label>
  <input id="plate" placeholder="例如：ABC-1234" onblur="formatPlate()">
  
  <label>車種</label>
  <input id="model" placeholder="例如：DRG 2.0">
  
  <label>您是這台車的？</label>
<select id="relationship">
  <option value="車主本人">車主本人</option>
  <option value="家人">家人</option>
  <option value="朋友">朋友</option>
  <option value="其他">其他</option>
</select>

  <button onclick="submitForm()">確認綁定</button>

  <div id="status"></div>

</div>

<script>

let lineProfile = null;

async function main() {

  await liff.init({
    liffId: "2011218129-CeYpPJHj"
  });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  lineProfile = await liff.getProfile();

  document.getElementById("status").innerText =
    "LINE 已登入：" + lineProfile.displayName;
}

async function submitForm() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const plate = document.getElementById("plate").value;
  const model = document.getElementById("model").value;
  const relationship = document.getElementById("relationship").value;

  if (!name || !phone || !plate) {
    alert("請填寫姓名、手機與車牌");
    return;
  }

  const data = {
  name: name,
  phone: phone,
  plate: plate,
  model: model,
  relationship: relationship,
  lineUserId: lineProfile.userId,
  lineDisplayName: lineProfile.displayName
};

 try {
  const response = await fetch("https://jay890217.app.n8n.cloud/webhook-test/932e0d03-1b34-42fc-91e3-361579504380", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  if (!response.ok) {
    throw new Error("送出失敗");
  }

  document.getElementById("status").innerText =
    "✅ 會員資料綁定成功";

} catch (error) {

  console.error(error);

  document.getElementById("status").innerText =
    "❌ 綁定失敗，請稍後再試";
}
}

  function formatPlate() {
  const input = document.getElementById("plate");

  let value = input.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  if (!value) return;

  let formatted = value;

  // 3碼 + 4碼，例如 ABC1234 → ABC-1234
  if (value.length === 7) {
    formatted = value.slice(0, 3) + "-" + value.slice(3);
  }

  // 2碼 + 4碼，例如 AB1234 → AB-1234
  else if (value.length === 6) {
    formatted = value.slice(0, 2) + "-" + value.slice(2);
  }

  // 4碼 + 4碼，例如 ABCD1234 → ABCD-1234
  else if (value.length === 8) {
    formatted = value.slice(0, 4) + "-" + value.slice(4);
  }

  // 3碼 + 3碼，例如 ABC123 → ABC-123
  else if (value.length === 6 && /^[A-Z]{3}\d{3}$/.test(value)) {
    formatted = value.slice(0, 3) + "-" + value.slice(3);
  }

  input.value = formatted;
}
main();

</script>

</body>
</html>
