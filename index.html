<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCGS 會員綁定</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 520px;
      margin: auto;
      background: #1d1d1d;
      padding: 24px;
      border-radius: 16px;
      border-top: 5px solid #ff6a00;
    }

    h1 {
      margin-bottom: 5px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #ff6a00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 16px;
      color: #ffb066;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>旭馳車業｜XCGS</h1>
  <div class="sub">會員資料綁定</div>

  <label>姓名</label>
  <input id="name" placeholder="請輸入姓名">

  <label>手機號碼</label>
  <input id="phone" placeholder="例如：0912345678">

  <label>車牌</label>
  <input id="plate" placeholder="例如：ABC-1234">

  <label>車種</label>
  <input id="model" placeholder="例如：DRG 2.0">

  <button onclick="submitForm()">確認綁定</button>

  <div id="status"></div>

</div>

<script>

let lineProfile = null;

async function main() {

  await liff.init({
    liffId: "2011218129-CeYpPJHj"
  });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  lineProfile = await liff.getProfile();

  document.getElementById("status").innerText =
    "LINE 已登入：" + lineProfile.displayName;
}

async function submitForm() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const plate = document.getElementById("plate").value;
  const model = document.getElementById("model").value;

  if (!name || !phone || !plate) {
    alert("請填寫姓名、手機與車牌");
    return;
  }

  const data = {
    name: name,
    phone: phone,
    plate: plate,
    model: model,
    lineUserId: lineProfile.userId,
    lineDisplayName: lineProfile.displayName
  };

  console.log(data);

  document.getElementById("status").innerText =
    "測試成功，資料已準備完成。";
}

main();

</script>

</body>
</html>
